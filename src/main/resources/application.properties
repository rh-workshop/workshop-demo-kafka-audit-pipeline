quarkus.application.name=kafka-logs-pipeline
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.log.category."org.apache.kafka".level=WARN

# Health checks para las probes de Kubernetes: /q/health/live publica el estado del bucle del rol.
quarkus.http.port=8080

# ---------------------------------------------------------------------------------------------
# Puente entre las variables PLANAS que inyectan los Deployments (ROLE, BOOTSTRAP...) y las
# propiedades con prefijo que espera @ConfigMapping(prefix="pipeline").
#
# Sin este puente, `ROLE=sink` en el manifiesto NO llegaba al mapeo —que buscaba PIPELINE_ROLE— y
# los tres despliegues arrancaban con el valor por defecto: el sink y el processor corrian como
# productor, publicando eventos falsos en vez de consumir. Cambiar aqui y no en los manifiestos
# evita tener que tocar los tres Deployments y el del productor externo.
#
# ':' = valor por defecto si la variable no viene; es la unica fuente de esos defaults.
# ---------------------------------------------------------------------------------------------
pipeline.ROLE=${ROLE:producer}
pipeline.BOOTSTRAP=${BOOTSTRAP:bank-kafka-kafka-bootstrap:9093}

# -- Cifrado del payload (el sink no monta la llave, por minimo privilegio)
pipeline.KV_KEY_FILE=${KV_KEY_FILE:/opt/kv/aes-key}
# Etiqueta de proposito del HKDF; subir la version al rotar la llave (y en el productor .NET).
# Este es el valor EFECTIVO; KeyDerivation.INFO_V1 replica la misma cadena como contrato con .NET.
pipeline.KEY_INFO=${KEY_INFO:produbanco/audit-log/aes256gcm/v1}
# Identifica la llave dentro del payload cifrado, para poder rotarla sin perder lo publicado.
pipeline.KEY_ID=${KEY_ID:1}
# Ventana de rotacion: llave ANTERIOR en modo solo-descifrado, mientras el topico la retenga.
# Sin defecto a proposito: se montan solo durante la rotacion y se retiran al terminar.
pipeline.PREVIOUS_KEY_FILE=${PREVIOUS_KEY_FILE:}
pipeline.PREVIOUS_KEY_ID=${PREVIOUS_KEY_ID:}
pipeline.PREVIOUS_KEY_INFO=${PREVIOUS_KEY_INFO:}

# -- mTLS contra Kafka (las contrasenas llegan por secretKeyRef, no son ficheros)
pipeline.tls.KEYSTORE=${KEYSTORE:/opt/user/user.p12}
pipeline.tls.TRUSTSTORE=${TRUSTSTORE:/opt/ca/ca.p12}
# Las contrasenas tambien necesitan puente: los Deployments las inyectan PLANAS por secretKeyRef.
# Sin estas dos lineas el mapeo buscaria PIPELINE_TLS_USER_PASSWORD y el arranque abortaria
# con "falta la variable USER_PASSWORD" -- el mismo fallo que ya rompio ROLE.
# Sin valor por defecto a proposito: una contrasena ausente debe fallar, no degradar a vacio.
pipeline.tls.USER_PASSWORD=${USER_PASSWORD:}
pipeline.tls.CA_PASSWORD=${CA_PASSWORD:}

# -- Productor de demostracion
# RATE_MS=50 da ~20 msg/s, la tasa que estima el sizing; 0 emite sin pausa.
pipeline.producer.RATE_MS=${RATE_MS:10000}
# PAYLOAD_BYTES=50000 alcanza los ~50 KiB por mensaje del sizing.
pipeline.producer.PAYLOAD_BYTES=${PAYLOAD_BYTES:0}
pipeline.producer.ENVIRONMENT=${ENVIRONMENT:dev}

# -- Fiabilidad del bucle de consumo (processor y sink)
pipeline.consumer.POLL_TIMEOUT_MS=${POLL_TIMEOUT_MS:1000}
pipeline.consumer.RETRY_BACKOFF_MS=${RETRY_BACKOFF_MS:3000}
# 10 fallos x 3 s = 30 s hasta que el pod entra en CrashLoop.
pipeline.consumer.MAX_CONSECUTIVE_FAILURES=${MAX_CONSECUTIVE_FAILURES:10}
