name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y probar
        run: ./mvnw -B verify

      # Control de auditoría: la imagen de producción no puede contener el generador de datos
      # ficticios. Si alguien vuelve a mezclarlos, el build falla aquí y no en una revisión.
      - name: Verificar que el artefacto de producción no lleva código de datos ficticios
        run: |
          if unzip -l pipeline/target/quarkus-app/app/*.jar | grep -i dummy; then
            echo "::error::El artefacto de producción contiene clases de datos ficticios"
            exit 1
          fi
          echo "OK: el artefacto de producción no contiene código de datos ficticios"
